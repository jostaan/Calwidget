name: Build Clock Widget APK

# Chạy thủ công: tab Actions -> Build Clock Widget APK -> Run workflow.
# Mã nguồn nằm trong lockscreen-widget.zip ở thư mục gốc repo; workflow tự giải nén rồi build.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Đặt "true" để căn giữa ô thời tiết (trên-phải); đặt "false" để trở về bố cục gốc.
      CENTER_WEATHER: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Unpack project
        run: |
          if [ ! -f lockscreen-widget.zip ]; then
            echo "Thiếu lockscreen-widget.zip ở thư mục gốc repo. Hãy tải tệp này lên rồi chạy lại."
            exit 1
          fi
          rm -rf _widget_src
          mkdir _widget_src
          unzip -q lockscreen-widget.zip -d _widget_src
          test -f _widget_src/lockscreen-widget/settings.gradle.kts

      - name: Center weather cell
        if: ${{ env.CENTER_WEATHER == 'true' }}
        run: |
          python3 - <<'PY'
          import glob, os
          base = "_widget_src/lockscreen-widget/app/src/main/res/layout"
          files = [f for p in ("w_", "nb_", "wp_") for f in glob.glob(os.path.join(base, p + "*.xml"))]
          n = 0
          for f in sorted(files):
              s = open(f, encoding="utf-8").read()
              a = s.index("@+id/box_wx")
              b = s.index("@+id/row2")
              seg = s[a:b]
              seg = seg.replace('android:gravity="start|center_vertical"', 'android:gravity="center"')
              seg = seg.replace('android:gravity="center_vertical"', 'android:gravity="center"')
              seg = seg.replace('android:paddingStart="8dp"', 'android:gravity="center_horizontal" android:paddingStart="8dp"', 1)
              open(f, "w", encoding="utf-8").write(s[:a] + seg + s[b:])
              n += 1
          print("Da can giua o thoi tiet trong", n, "tep layout")
          assert n == 36, "Khong thay du 36 tep layout"
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: _widget_src/lockscreen-widget
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: cp _widget_src/lockscreen-widget/app/build/outputs/apk/debug/app-debug.apk ClockWidget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: clock-widget-apk
          path: ClockWidget.apk
          if-no-files-found: error

      # Tag riêng "widget-N", không chiếm nhãn Latest của app khác trong cùng repo.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "widget-${{ github.run_number }}" ClockWidget.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Clock Widget ${{ github.run_number }}" \
            --notes "Commit $GITHUB_SHA" \
            --latest=false
