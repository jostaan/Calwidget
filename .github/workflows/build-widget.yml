name: Build Clock Widget APK

# Chạy thủ công: tab Actions -> Build Clock Widget APK -> Run workflow.
# Mã nguồn nằm trong lockscreen-widget.zip ở thư mục gốc repo; workflow tự giải nén rồi build.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # ===== CÁC NÚT CHỈNH (sửa số rồi chạy lại workflow, không cần tải lại zip) =====
      # "true": căn giữa ô thời tiết và ô âm lịch (ô ngày vốn đã giữa; ô sự kiện luôn căn trái).
      # "false": giữ bố cục gốc.
      CENTER_CELLS: "true"
      # Cỡ chữ (sp) theo 6 vai trò. Bản gốc: 60 / 40 / 24 / 16 / 13 / 12 và icon 36.
      # Chỉ nhập bội của 0.5 (ví dụ 12.5). Đặt lại đúng số gốc để trở về cỡ ban đầu.
      SZ_HERO: "59"      # ngày dương
      SZ_DISPLAY: "39"   # nhiệt độ
      SZ_TITLE: "23"     # ngày âm
      SZ_HEADING: "15"   # tháng, thứ
      SZ_BODY: "12.5"    # nội dung (gió, UV, AQI, sự kiện...)
      SZ_CAPTION: "11.5" # chú thích
      SZ_ICON: "35"      # biểu tượng thời tiết (dp)
    steps:
      - uses: actions/checkout@v5

      - name: Unpack project
        run: |
          if [ ! -f lockscreen-widget.zip ]; then
            echo "Thiếu lockscreen-widget.zip ở thư mục gốc repo. Hãy tải tệp này lên rồi chạy lại."
            exit 1
          fi
          rm -rf _widget_src
          mkdir _widget_src
          unzip -q lockscreen-widget.zip -d _widget_src
          test -f _widget_src/lockscreen-widget/settings.gradle.kts

      - name: Tune layout (center cells, font sizes)
        run: |
          python3 - <<'PY'
          import glob, os, re

          src = "_widget_src/lockscreen-widget/app/src/main"
          lay = src + "/res/layout"
          renderer = src + "/java/vn/xin/clockwidget/Renderer.kt"

          # ---------- 1) Căn giữa ô thời tiết và ô âm lịch ----------
          if os.environ.get("CENTER_CELLS", "true") == "true":
              files = sorted(f for p in ("w_", "nb_", "wp_") for f in glob.glob(lay + "/" + p + "*.xml"))
              assert len(files) == 36, "Can 36 tep layout, thay %d" % len(files)

              def cut(s, start_id, end_id):
                  a = s.index('@+id/' + start_id)
                  b = s.index('@+id/' + end_id)
                  return s[:a], s[a:b], s[b:]

              def center_texts(seg):
                  seg = seg.replace('android:gravity="start|center_vertical"', 'android:gravity="center"')
                  return seg.replace('android:gravity="center_vertical"', 'android:gravity="center"')

              def center_box(seg, pad):
                  assert pad in seg
                  return seg.replace(pad, 'android:gravity="center_horizontal"\n                ' + pad, 1)

              for f in files:
                  s = open(f, encoding="utf-8").read()
                  # Thời tiết: từ box_wx đến row2 (hàng dưới).
                  head, seg, tail = cut(s, "box_wx", "row2")
                  s = head + center_box(center_texts(seg), 'android:paddingStart="8dp"') + tail
                  # Âm lịch: từ box_lu đến dvv2 (đường kẻ trước ô sự kiện).
                  head, seg, tail = cut(s, "box_lu", "dvv2")
                  seg = center_box(center_texts(seg), 'android:paddingEnd="8dp"')
                  # Tên sao hoàng/hắc đạo: bỏ trọng số để cả cụm chấm + chữ nằm giữa.
                  seg, n = re.subn(
                      r'(android:id="@\+id/lu3b"\s+)android:layout_width="0dp"(\s+)android:layout_height="wrap_content"(\s+)android:layout_weight="1"',
                      r'\1android:layout_width="wrap_content"\2android:layout_height="wrap_content"', seg)
                  assert n == 1, "Khong sua duoc lu3b trong " + f
                  open(f, "w", encoding="utf-8").write(head + seg + tail)
              print("Da can giua o thoi tiet va o am lich trong", len(files), "tep layout")

          # ---------- 2) Cỡ chữ ----------
          OLD = {"HERO": 60.0, "DISPLAY": 40.0, "TITLE": 24.0, "HEADING": 16.0, "BODY": 13.0, "CAPTION": 12.0, "ICON_DP": 36.0}
          KEY = {"HERO": "SZ_HERO", "DISPLAY": "SZ_DISPLAY", "TITLE": "SZ_TITLE", "HEADING": "SZ_HEADING",
                 "BODY": "SZ_BODY", "CAPTION": "SZ_CAPTION", "ICON_DP": "SZ_ICON"}
          new = {}
          for k, v in OLD.items():
              x = float(os.environ.get(KEY[k], "").strip() or v)
              assert 6 <= x <= 80 and (x * 2) % 1 == 0, KEY[k] + " phai la boi cua 0.5 trong khoang 6-80"
              new[k] = x
          fmt = lambda x: ("%g" % x)

          s = open(renderer, encoding="utf-8").read()
          for k in OLD:
              s, n = re.subn(r'(private const val %s = )[0-9.]+f' % k, lambda m: m.group(1) + fmt(new[k]) + "f", s)
              assert n == 1, "Khong thay hang so " + k + " trong Renderer.kt"
          open(renderer, "w", encoding="utf-8").write(s)

          # Cỡ chữ mẫu trong layout (dùng cho xem trước ở màn chọn widget); lúc chạy Renderer đặt lại cỡ thật.
          size_map = {OLD[k]: new[k] for k in ("HERO", "DISPLAY", "TITLE", "HEADING", "BODY", "CAPTION")}
          def sp(m):
              v = float(m.group(1))
              return 'android:textSize="%ssp"' % fmt(size_map.get(v, v))
          for f in glob.glob(lay + "/*.xml"):
              t = open(f, encoding="utf-8").read()
              open(f, "w", encoding="utf-8").write(re.sub(r'android:textSize="([0-9.]+)sp"', sp, t))
          print("Co chu:", {k: fmt(v) for k, v in new.items()})
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: _widget_src/lockscreen-widget
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: cp _widget_src/lockscreen-widget/app/build/outputs/apk/debug/app-debug.apk ClockWidget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: clock-widget-apk
          path: ClockWidget.apk
          if-no-files-found: error

      # Tag riêng "widget-N", không chiếm nhãn Latest của app khác trong cùng repo.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "widget-${{ github.run_number }}" ClockWidget.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Clock Widget ${{ github.run_number }}" \
            --notes "Commit $GITHUB_SHA" \
            --latest=false
